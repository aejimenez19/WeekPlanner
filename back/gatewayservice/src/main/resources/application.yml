server:
  port: 8080

spring:
  application:
    name: gatewayservice
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

  security:
    user:
      name: admin
      password: admin

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTThatIsAtLeast256BitsLong123456}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  services:
    auth-url: ${AUTH_SERVICE_URL:http://auth-service:8080}
    task-url: ${TASK_SERVICE_URL:http://task-service:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG