@if (variant() === 'desktop') {
  <a
    class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary font-bold rounded-xl transition-all"
    [routerLink]="route()"
    routerLinkActive="bg-surface-container-high text-primary"
    [routerLinkActiveOptions]="{exact: exact()}"
  >
    <span class="material-symbols-outlined">{{ icon() }}</span>
    <span>{{ label() }}</span>
  </a>
} @else {
  <a
    class="flex flex-col items-center gap-1 text-on-surface-variant"
    [routerLink]="route()"
    routerLinkActive="text-primary"
    [routerLinkActiveOptions]="{exact: exact()}"
  >
    <span
      class="material-symbols-outlined"
      [style.font-variation-settings]="filled() ? '\'FILL\' 1' : null"
    >{{ icon() }}</span>
    <span class="text-[10px] font-bold uppercase tracking-tighter">{{ label() }}</span>
  </a>
}
