<!-- Desktop Sidebar Navigation -->
<aside class="hidden md:flex flex-col h-screen w-64 fixed left-0 top-0 bg-surface-container-low p-6 space-y-8 z-50">
  <div class="flex items-center gap-3">
    <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-on-primary">
      <span class="material-symbols-outlined">menu_book</span>
    </div>
    <div>
      <h1 class="text-lg font-extrabold text-primary leading-none">WeekPlanner</h1>
      <p class="text-xs text-on-tertiary-fixed-variant mt-1">The Digital Curator</p>
    </div>
  </div>

  <nav class="flex-1 space-y-2">
    <!-- <app-nav-item icon="inbox" label="Inbox" route="/dashboard/inbox" [exact]="true" /> -->
    <app-nav-item icon="event_repeat" label="Plan" route="/dashboard/plan" />
  </nav>

  <div class="pt-6 space-y-2 border-t border-outline-variant/10">
    <a class="flex items-center gap-3 px-4 py-2 text-sm text-on-surface-variant hover:text-primary transition-colors cursor-pointer" (click)="logout()">
      <span class="material-symbols-outlined text-base">logout</span>
      <span>Sign Out</span>
    </a>
  </div>
</aside>

<!-- Mobile Top Bar -->
<header class="md:hidden sticky top-0 flex justify-between items-center px-6 h-16 w-full bg-surface-container-low z-40">
  <h1 class="text-xl font-bold tracking-tighter text-primary">WeekPlanner</h1>
  <div class="flex items-center gap-4">
    <span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
    <div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden">
      <img class="w-full h-full object-cover" alt="User avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBr3-WS3Ks_Of9o_V2x7K32nl515NttTDHNbuV1HY1hj5ZnHoDX1MNm26vOIvWdQZGxhYKdVb7eYtxeMnGgpScyEW2VPlqbqPnClwpPjxl1d2DUOvg9VRWsKhf3qOUcdrGY2JfWmfrlKIHhfOYcZqOOuMdWd0-w4aj8kaJN5GW0CVCl7BEN4F8w0_zkKydHmWzo2qtHPV_WZMYgMlejl2sFXpboMjq_DNdH2mTMKWsD2os03HVW8YfYEtt5s4TAZ5DpL0ymdUrYJVxD"/>
    </div>
  </div>
</header>

<!-- Main Content Area with Router Outlet -->
<main class="md:ml-64 h-[80vh] max-h-[80vh] overflow-hidden flex flex-col">
  <router-outlet></router-outlet>
</main>

<!-- Mobile Navigation Bar -->
<nav class="md:hidden fixed bottom-0 left-0 right-0 bg-surface-dim h-20 flex items-center justify-around px-4 z-50">
  <app-nav-item variant="mobile" icon="inbox" label="Inbox" route="/dashboard/inbox" [exact]="true" [filled]="true" />
  <app-nav-item variant="mobile" icon="event_repeat" label="Plan" route="/dashboard/plan" />
  <a class="flex flex-col items-center gap-1 text-on-surface-variant" routerLink="/dashboard/inbox" fragment="new">
    <span class="material-symbols-outlined text-2xl">edit</span>
  </a>
  <app-nav-item variant="mobile" icon="view_week" label="Week" route="/dashboard/plan" />
  <a class="flex flex-col items-center gap-1 text-on-surface-variant">
    <span class="material-symbols-outlined">folder_open</span>
    <span class="text-[10px] font-bold uppercase tracking-tighter">Files</span>
  </a>
</nav>
