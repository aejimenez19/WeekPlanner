<div class="min-h-screen bg-background flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="glass-card">
      <header class="text-center mb-8">
        <h1 class="text-display-md text-on-surface">Crear cuenta</h1>
        <p class="text-body-lg text-on-surface-variant mt-2">Organiza tu semana con claridad</p>
      </header>

      <form (ngSubmit)="onSubmit()" class="space-y-6">
        @if (error()) {
          <div class="bg-error/10 text-error px-4 py-3 rounded-xl text-body-sm">
            {{ error() }}
          </div>
        }

        <div class="space-y-2">
          <label for="fullName" class="text-label-md text-on-surface-variant">Nombre completo</label>
          <input
            type="text"
            id="fullName"
            [(ngModel)]="fullName"
            name="fullName"
            required
            class="input-field w-full"
            placeholder="Juan Pérez"
          />
        </div>

        <div class="space-y-2">
          <label for="email" class="text-label-md text-on-surface-variant">Correo electrónico</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            class="input-field w-full"
            placeholder="juan@ejemplo.com"
          />
        </div>

        <div class="space-y-2">
          <label for="password" class="text-label-md text-on-surface-variant">Contraseña</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            minlength="6"
            class="input-field w-full"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          [disabled]="isLoading()"
          class="btn-primary w-full disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (isLoading()) {
            <span>Creando cuenta...</span>
          } @else {
            <span>Registrarse</span>
          }
        </button>
      </form>

      <footer class="mt-8 text-center">
        <p class="text-body-md text-on-surface-variant">
          ¿Ya tienes una cuenta?
          <a routerLink="/login" class="text-primary font-medium hover:underline">Iniciar sesión</a>
        </p>
      </footer>
    </div>
  </div>
</div>
